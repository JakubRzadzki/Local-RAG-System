[project]
name = "local-rag-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jakub Rządzki", email = "jakub.rz456@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[dev]>=0.143.3",
    "ollama>=0.6.3",
    "pgvector>=0.5.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
local-rag-system = "local_rag_system:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
